# Copy this file, replace the placeholder values, and pass it explicitly with
# --bfts-config when submitting generated experiments through Slurm.
data_dir: "data"
preprocess_data: False

goal: null
eval: null

log_dir: logs
workspace_dir: workspaces
copy_data: True
exp_name: run

exec:
  backend: slurm
  timeout: 3600
  agent_file_name: runfile.py
  format_tb_ipython: False
  slurm:
    host: "YOUR_SSH_HOST"
    remote_root: "/path/to/your/remote/ai-scientist-runs"
    template: "job_template.private.slurm"
    poll_seconds: 20
    keep_remote: true

generate_report: True

report:
  model: gpt-4o-2024-11-20
  temp: 1.0

experiment:
  num_syn_datasets: 1

debug:
  stage4: False

agent:
  type: parallel
  # Start with one submitted job at a time. Raise this only after confirming
  # your Slurm quota and experiment environment are stable.
  num_workers: 1
  stages:
    stage1_max_iters: 20
    stage2_max_iters: 12
    stage3_max_iters: 12
    stage4_max_iters: 18
  steps: 5
  k_fold_validation: 1
  multi_seed_eval:
    num_seeds: 1
  expose_prediction: False
  data_preview: False

  code:
    model: anthropic.claude-3-5-sonnet-20241022-v2:0
    temp: 1.0
    max_tokens: 12000

  feedback:
    model: gpt-4o-2024-11-20
    temp: 0.5
    max_tokens: 8192

  vlm_feedback:
    model: gpt-4o-2024-11-20
    temp: 0.5
    max_tokens: null

  search:
    max_debug_depth: 3
    debug_prob: 0.5
    num_drafts: 3
